<title>SomeViz · a path through red</title>
<style>
:root { color-scheme: light dark; --bg:#f7f8fa; --panel:#fff; --text:#17212c; --muted:#586575; --edge:#bdc7d1; --border:#dce2e8; --blue:#2563b9; --green:#17805c; --orange:#b45c09; --red:#bd3345; --redfill:#ffe6e9; }

* { box-sizing:border-box; }
body { margin:0; padding:32px 20px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
main { max-width:860px; margin:auto; }
h1 { margin:0; font-size:30px; font-weight:650; letter-spacing:-1px; }
.subtitle { color:var(--muted); margin:2px 0 22px; }
.chooser { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
select { max-width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--panel); font:inherit; }
.phases { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.phase { padding:4px 10px; color:var(--muted); border-bottom:2px solid transparent; }
.phase[aria-current="step"] { color:var(--text); border-color:var(--text); }
.stage { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:12px; }
svg { display:block; width:100%; overflow:visible; }
svg text { fill:var(--text); font:500 14px system-ui,sans-serif; text-anchor:middle; dominant-baseline:middle; }
.edge { stroke:var(--edge); stroke-width:1.7; fill:none; }
.temporary { stroke-dasharray:5 5; }
.flow { stroke:var(--blue); stroke-width:3.5; fill:none; }
.left { stroke:var(--green); stroke-width:4; fill:none; }
.right { stroke:var(--blue); stroke-width:4; fill:none; }
.walk { stroke:var(--green); stroke-width:5; fill:none; }
.cancel { stroke:var(--orange); stroke-width:5; stroke-dasharray:7 5; fill:none; }
.vertex { fill:var(--panel); stroke:var(--edge); stroke-width:1.8; }
.endpoint { stroke:var(--text); stroke-width:2.6; }
.red { fill:var(--redfill); stroke:var(--red); stroke-width:2.6; }
.target { fill:var(--panel); stroke:var(--muted); stroke-width:1.8; stroke-dasharray:4 3; }
.blocked { stroke:var(--orange); stroke-dasharray:3 3; opacity:.65; }
.blocked-cross { stroke:var(--orange); stroke-width:1.8; }
.candidate { fill:none; stroke:var(--text); stroke-width:1.2; }
.label { font-size:12px; fill:var(--muted); }
.legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin:10px 0 0; }
.swatch { display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:5px; background:var(--blue); }
.swatch.green { background:var(--green); } .swatch.orange { background:var(--orange); }
.swatch.red-dot { background:var(--red); width:9px; height:9px; border-radius:50%; }
.controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:18px 0; }
button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 14px; cursor:pointer; }
button.primary { background:var(--text); color:var(--bg); border-color:var(--text); min-width:90px; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
input { flex:1; min-width:110px; accent-color:var(--blue); }
.counter { font-variant-numeric:tabular-nums; color:var(--muted); min-width:64px; text-align:right; }
h2 { margin:0 0 5px; font-size:19px; font-weight:600; }
.detail { margin:0; color:var(--muted); min-height:3em; }
.note { margin:20px 0 0; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; }
@media(max-width:480px) { body { padding:18px 12px; } .stage { padding:4px; } .phase { padding:3px 5px; font-size:13px; } button { padding:9px 11px; } }
</style>
</head>

<main id="someviz">

  <div class="controls">
    <button type="button" class="primary" id="play">Play</button>
    <button type="button" id="back" aria-label="Previous step">Back</button>
    <button type="button" id="next" aria-label="Next step">Next</button>
    <input type="range" id="step" min="0" value="0" aria-label="Animation step">
    <span class="counter" id="counter"></span>
  </div>
  <section aria-live="polite" aria-atomic="true"><h2 id="title"></h2><p class="detail" id="detail"></p></section>

</main>
